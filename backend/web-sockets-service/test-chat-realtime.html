<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat en Tiempo Real - LinkedUp</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        .chat-window {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            height: 700px;
        }
        
        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 12px 12px 0 0;
        }
        
        .chat-header h2 {
            font-size: 20px;
            margin-bottom: 10px;
        }
        
        .connection-form {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        
        .connection-form input {
            flex: 1;
            padding: 8px 12px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
        }
        
        .connection-form button {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            background: white;
            color: #667eea;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .connection-form button:hover {
            transform: scale(1.05);
        }
        
        .connection-form button.connected {
            background: #10b981;
            color: white;
        }
        
        .room-info {
            padding: 15px 20px;
            background: #f9fafb;
            border-bottom: 2px solid #e5e7eb;
        }
        
        .room-form {
            display: flex;
            gap: 10px;
        }
        
        .room-form input {
            flex: 1;
            padding: 8px 12px;
            border: 2px solid #e5e7eb;
            border-radius: 6px;
            font-size: 14px;
        }
        
        .room-form button {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            background: #667eea;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .room-form button:hover {
            background: #5568d3;
        }
        
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f9fafb;
        }
        
        .message {
            margin-bottom: 15px;
            animation: slideIn 0.3s ease-out;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .message.own {
            text-align: right;
        }
        
        .message-bubble {
            display: inline-block;
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 18px;
            word-wrap: break-word;
        }
        
        .message.own .message-bubble {
            background: #667eea;
            color: white;
            border-bottom-right-radius: 4px;
        }
        
        .message.other .message-bubble {
            background: white;
            color: #374151;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .message-info {
            font-size: 11px;
            margin-top: 4px;
            opacity: 0.7;
        }
        
        .message.own .message-info {
            color: #667eea;
        }
        
        .message.other .message-info {
            color: #6b7280;
        }
        
        .sender-name {
            font-weight: bold;
            margin-bottom: 4px;
            font-size: 12px;
        }
        
        .input-container {
            padding: 15px 20px;
            background: white;
            border-top: 2px solid #e5e7eb;
            display: flex;
            gap: 10px;
        }
        
        .input-container input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 24px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        .input-container input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .input-container button {
            padding: 12px 24px;
            border: none;
            border-radius: 24px;
            background: #667eea;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .input-container button:hover {
            background: #5568d3;
            transform: scale(1.05);
        }
        
        .input-container button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
            transform: none;
        }
        
        .status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            margin-left: 10px;
        }
        
        .status.connected {
            background: #10b981;
            color: white;
        }
        
        .status.disconnected {
            background: #ef4444;
            color: white;
        }
        
        .typing-indicator {
            padding: 10px 20px;
            font-size: 13px;
            color: #6b7280;
            font-style: italic;
            min-height: 33px;
        }
        
        .system-message {
            text-align: center;
            color: #6b7280;
            font-size: 13px;
            margin: 10px 0;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Chat Usuario 1 -->
        <div class="chat-window">
            <div class="chat-header">
                <h2>👤 Usuario 1 <span class="status disconnected" id="status1">Desconectado</span></h2>
                <div class="connection-form">
                    <input type="text" id="userId1" placeholder="Tu User ID" value="user-001">
                    <button onclick="connect(1)" id="connectBtn1">Conectar</button>
                </div>
            </div>
            <div class="room-info">
                <div class="room-form">
                    <input type="text" id="roomId1" placeholder="Room ID" value="6920c4d2bf63c4d06595a239">
                    <button onclick="joinRoom(1)" id="joinBtn1">Unirse</button>
                </div>
            </div>
            <div class="messages-container" id="messages1"></div>
            <div class="typing-indicator" id="typing1"></div>
            <div class="input-container">
                <input type="text" id="messageInput1" placeholder="Escribe un mensaje..." onkeypress="handleKeyPress(event, 1)" disabled>
                <button onclick="sendMessage(1)" id="sendBtn1" disabled>Enviar</button>
            </div>
        </div>
        
        <!-- Chat Usuario 2 -->
        <div class="chat-window">
            <div class="chat-header">
                <h2>👤 Usuario 2 <span class="status disconnected" id="status2">Desconectado</span></h2>
                <div class="connection-form">
                    <input type="text" id="userId2" placeholder="Tu User ID" value="user-002">
                    <button onclick="connect(2)" id="connectBtn2">Conectar</button>
                </div>
            </div>
            <div class="room-info">
                <div class="room-form">
                    <input type="text" id="roomId2" placeholder="Room ID" value="6920c4d2bf63c4d06595a239">
                    <button onclick="joinRoom(2)" id="joinBtn2">Unirse</button>
                </div>
            </div>
            <div class="messages-container" id="messages2"></div>
            <div class="typing-indicator" id="typing2"></div>
            <div class="input-container">
                <input type="text" id="messageInput2" placeholder="Escribe un mensaje..." onkeypress="handleKeyPress(event, 2)" disabled>
                <button onclick="sendMessage(2)" id="sendBtn2" disabled>Enviar</button>
            </div>
        </div>
    </div>

    <script>
        const sockets = {
            1: null,
            2: null
        };
        
        const userData = {
            1: { userId: '', roomId: '' },
            2: { userId: '', roomId: '' }
        };

        function connect(user) {
            const userId = document.getElementById(`userId${user}`).value;
            if (!userId) {
                alert('Por favor ingresa un User ID');
                return;
            }

            userData[user].userId = userId;

            sockets[user] = io('http://localhost:3002', {
                transports: ['websocket', 'polling'],
                reconnection: true
            });

            sockets[user].on('connect', () => {
                updateStatus(user, true);
                addSystemMessage(user, '✅ Conectado al servidor');
                
                // Registrar usuario automáticamente
                sockets[user].emit('register', { userId });
                
                document.getElementById(`connectBtn${user}`).textContent = 'Conectado';
                document.getElementById(`connectBtn${user}`).classList.add('connected');
            });

            sockets[user].on('disconnect', () => {
                updateStatus(user, false);
                addSystemMessage(user, '❌ Desconectado del servidor');
                document.getElementById(`connectBtn${user}`).textContent = 'Conectar';
                document.getElementById(`connectBtn${user}`).classList.remove('connected');
            });

            sockets[user].on('registered', (data) => {
                addSystemMessage(user, `Registrado como: ${data.userId}`);
            });

            sockets[user].on('joinedRoom', (data) => {
                addSystemMessage(user, `Te uniste a la sala`);
                document.getElementById(`messageInput${user}`).disabled = false;
                document.getElementById(`sendBtn${user}`).disabled = false;
            });

            sockets[user].on('historicalMessage', (data) => {
                const isOwn = data.senderId === userData[user].userId;
                addMessage(user, data.senderId, data.content, isOwn);
            });

            sockets[user].on('newMessage', (data) => {
                const isOwn = data.senderId === userData[user].userId;
                addMessage(user, data.senderId, data.content, isOwn);
            });

            sockets[user].on('messageSent', (data) => {
                console.log(`Usuario ${user} - Mensaje enviado:`, data);
            });

            sockets[user].on('messageError', (data) => {
                addSystemMessage(user, `❌ Error: ${data.error}`);
            });

            sockets[user].on('userJoined', (data) => {
                addSystemMessage(user, `👤 ${data.userId} se unió a la sala`);
            });

            sockets[user].on('userLeft', (data) => {
                addSystemMessage(user, `👋 ${data.userId} salió de la sala`);
            });

            sockets[user].on('typing', (data) => {
                if (data.userId !== userData[user].userId) {
                    showTyping(user, data.userId);
                }
            });
        }

        function joinRoom(user) {
            if (!sockets[user]) {
                alert('Primero conecta al servidor');
                return;
            }

            const roomId = document.getElementById(`roomId${user}`).value;
            if (!roomId) {
                alert('Por favor ingresa un Room ID');
                return;
            }

            userData[user].roomId = roomId;
            sockets[user].emit('joinRoom', { 
                roomId, 
                userId: userData[user].userId 
            });
        }

        function sendMessage(user) {
            if (!sockets[user]) return;

            const input = document.getElementById(`messageInput${user}`);
            const content = input.value.trim();
            
            if (!content) return;

            const message = {
                senderId: userData[user].userId,
                roomId: userData[user].roomId,
                content
            };

            sockets[user].emit('sendMessage', message);
            // No mostrar el mensaje aquí, esperar a que llegue newMessage del servidor
            input.value = '';
        }

        function addMessage(user, senderId, content, isOwn) {
            const container = document.getElementById(`messages${user}`);
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isOwn ? 'own' : 'other'}`;
            
            const time = new Date().toLocaleTimeString('es-ES', { 
                hour: '2-digit', 
                minute: '2-digit' 
            });
            
            messageDiv.innerHTML = `
                ${!isOwn ? `<div class="sender-name">${senderId}</div>` : ''}
                <div class="message-bubble">${content}</div>
                <div class="message-info">${time}</div>
            `;
            
            container.appendChild(messageDiv);
            container.scrollTop = container.scrollHeight;
        }

        function addSystemMessage(user, message) {
            const container = document.getElementById(`messages${user}`);
            const messageDiv = document.createElement('div');
            messageDiv.className = 'system-message';
            messageDiv.textContent = message;
            container.appendChild(messageDiv);
            container.scrollTop = container.scrollHeight;
        }

        function updateStatus(user, connected) {
            const status = document.getElementById(`status${user}`);
            status.className = `status ${connected ? 'connected' : 'disconnected'}`;
            status.textContent = connected ? 'Conectado' : 'Desconectado';
        }

        function showTyping(user, userId) {
            const typing = document.getElementById(`typing${user}`);
            typing.textContent = `${userId} está escribiendo...`;
            
            setTimeout(() => {
                typing.textContent = '';
            }, 3000);
        }

        function handleKeyPress(event, user) {
            if (event.key === 'Enter') {
                sendMessage(user);
            }
        }
    </script>
</body>
</html>
