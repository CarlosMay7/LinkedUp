<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebSocket Test Client - LinkedUp</title>
  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px 30px;
      text-align: center;
    }

    .header h1 {
      margin-bottom: 5px;
    }

    .status {
      display: inline-block;
      padding: 5px 15px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: bold;
      margin-top: 10px;
    }

    .status.connected {
      background: #10b981;
    }

    .status.disconnected {
      background: #ef4444;
    }

    .main {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      padding: 30px;
    }

    .panel {
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 20px;
    }

    .panel h2 {
      color: #667eea;
      margin-bottom: 15px;
      font-size: 18px;
      border-bottom: 2px solid #667eea;
      padding-bottom: 8px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      color: #4b5563;
      font-weight: 500;
      font-size: 14px;
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 14px;
      transition: border-color 0.2s;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: #667eea;
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      transition: transform 0.2s, box-shadow 0.2s;
      width: 100%;
      margin-top: 10px;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }

    button:active {
      transform: translateY(0);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .log-panel {
      grid-column: 1 / -1;
    }

    #log {
      background: #1f2937;
      color: #10b981;
      padding: 15px;
      border-radius: 6px;
      height: 300px;
      overflow-y: auto;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      line-height: 1.6;
    }

    .log-entry {
      margin-bottom: 8px;
      padding: 5px;
      border-radius: 3px;
    }

    .log-entry.event {
      color: #60a5fa;
    }

    .log-entry.error {
      color: #f87171;
    }

    .log-entry.success {
      color: #34d399;
    }

    .log-entry.info {
      color: #a78bfa;
    }

    .timestamp {
      color: #6b7280;
      font-size: 11px;
    }

    .clear-btn {
      background: #ef4444;
      margin-top: 10px;
    }

    .clear-btn:hover {
      box-shadow: 0 5px 15px rgba(239, 68, 68, 0.4);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🔌 WebSocket Test Client</h1>
      <p>LinkedUp Chat Service - Socket.IO v4.8.1</p>
      <div class="status disconnected" id="status">● Desconectado</div>
    </div>

    <div class="main">
      <!-- Connection Panel -->
      <div class="panel">
        <h2>🔗 Conexión</h2>
        <div class="form-group">
          <label for="serverUrl">URL del Servidor</label>
          <input type="text" id="serverUrl" value="http://localhost:3002" placeholder="http://localhost:3002">
        </div>
        <button onclick="connect()" id="connectBtn">Conectar</button>
        <button onclick="disconnect()" id="disconnectBtn" disabled>Desconectar</button>
      </div>

      <!-- Register Panel -->
      <div class="panel">
        <h2>👤 Registrar Usuario</h2>
        <div class="form-group">
          <label for="userId">ID de Usuario</label>
          <input type="text" id="userId" placeholder="user-123">
        </div>
        <button onclick="register()" id="registerBtn" disabled>Registrar</button>
      </div>

      <!-- Room Panel -->
      <div class="panel">
        <h2>🏠 Gestión de Salas</h2>
        <div class="form-group">
          <label for="roomId">ID de Sala</label>
          <input type="text" id="roomId" placeholder="room-456">
        </div>
        <div class="grid-2">
          <button onclick="joinRoom()" id="joinBtn" disabled>Unirse</button>
          <button onclick="leaveRoom()" id="leaveBtn" disabled>Salir</button>
        </div>
        <button onclick="getOnlineUsers()" id="onlineBtn" disabled>Ver Usuarios Online</button>
      </div>

      <!-- Message Panel -->
      <div class="panel">
        <h2>💬 Enviar Mensaje</h2>
        <div class="form-group">
          <label for="receiverId">ID Receptor (opcional)</label>
          <input type="text" id="receiverId" placeholder="user-789">
        </div>
        <div class="form-group">
          <label for="messageContent">Mensaje</label>
          <textarea id="messageContent" placeholder="Escribe tu mensaje aquí..."></textarea>
        </div>
        <button onclick="sendMessage()" id="sendBtn" disabled>Enviar Mensaje</button>
        <button onclick="sendTyping()" id="typingBtn" disabled>Simular Typing</button>
      </div>

      <!-- Log Panel -->
      <div class="panel log-panel">
        <h2>📋 Log de Eventos</h2>
        <div id="log"></div>
        <button class="clear-btn" onclick="clearLog()">Limpiar Log</button>
      </div>
    </div>
  </div>

  <script>
    let socket = null;
    let currentUserId = null;
    let currentRoomId = null;

    function log(message, type = 'info') {
      const logDiv = document.getElementById('log');
      const timestamp = new Date().toLocaleTimeString();
      const entry = document.createElement('div');
      entry.className = `log-entry ${type}`;
      entry.innerHTML = `<span class="timestamp">[${timestamp}]</span> ${message}`;
      logDiv.appendChild(entry);
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    function updateStatus(connected) {
      const statusDiv = document.getElementById('status');
      if (connected) {
        statusDiv.className = 'status connected';
        statusDiv.textContent = '● Conectado';
      } else {
        statusDiv.className = 'status disconnected';
        statusDiv.textContent = '● Desconectado';
      }
      updateButtons(connected);
    }

    function updateButtons(connected) {
      document.getElementById('connectBtn').disabled = connected;
      document.getElementById('disconnectBtn').disabled = !connected;
      document.getElementById('registerBtn').disabled = !connected;
      document.getElementById('joinBtn').disabled = !connected;
      document.getElementById('leaveBtn').disabled = !connected;
      document.getElementById('sendBtn').disabled = !connected;
      document.getElementById('typingBtn').disabled = !connected;
      document.getElementById('onlineBtn').disabled = !connected;
    }

    function connect() {
      const serverUrl = document.getElementById('serverUrl').value;
      log(`🔄 Intentando conectar a ${serverUrl}...`, 'info');

      socket = io(serverUrl, {
        transports: ['websocket', 'polling'],
        reconnection: true,
        reconnectionDelay: 1000,
        reconnectionAttempts: 5
      });

      socket.on('connect', () => {
        log(`✅ Conectado exitosamente! Socket ID: ${socket.id}`, 'success');
        updateStatus(true);
      });

      socket.on('disconnect', (reason) => {
        log(`❌ Desconectado. Razón: ${reason}`, 'error');
        updateStatus(false);
      });

      socket.on('connect_error', (error) => {
        log(`❌ Error de conexión: ${error.message}`, 'error');
        updateStatus(false);
      });

      // Event listeners
      socket.on('registered', (data) => {
        log(`✅ Usuario registrado: ${JSON.stringify(data)}`, 'success');
        currentUserId = data.data.userId;
      });

      socket.on('joinedRoom', (data) => {
        log(`🏠 Te uniste a la sala: ${JSON.stringify(data)}`, 'event');
        currentRoomId = data.data.roomId;
      });

      socket.on('leftRoom', (data) => {
        log(`🚪 Saliste de la sala: ${JSON.stringify(data)}`, 'event');
      });

      socket.on('userJoined', (data) => {
        log(`👋 Usuario se unió: ${JSON.stringify(data)}`, 'event');
      });

      socket.on('userLeft', (data) => {
        log(`👋 Usuario salió: ${JSON.stringify(data)}`, 'event');
      });

      socket.on('messageQueued', (data) => {
        log(`📤 Mensaje en cola: ${JSON.stringify(data)}`, 'success');
      });

      socket.on('newMessage', (data) => {
        log(`📨 Nuevo mensaje: ${JSON.stringify(data)}`, 'event');
      });

      socket.on('messageError', (data) => {
        log(`❌ Error de mensaje: ${JSON.stringify(data)}`, 'error');
      });

      socket.on('typing', (data) => {
        log(`⌨️ Usuario escribiendo: ${JSON.stringify(data)}`, 'event');
      });

      socket.on('messageDelivered', (data) => {
        log(`✓ Mensaje entregado: ${JSON.stringify(data)}`, 'event');
      });

      socket.on('messageRead', (data) => {
        log(`✓✓ Mensaje leído: ${JSON.stringify(data)}`, 'event');
      });

      socket.on('onlineUsers', (data) => {
        log(`👥 Usuarios online: ${JSON.stringify(data)}`, 'info');
      });

      // Catch all other events
      socket.onAny((eventName, ...args) => {
        if (!['connect', 'disconnect', 'registered', 'joinedRoom', 'leftRoom', 
              'userJoined', 'userLeft', 'messageQueued', 'newMessage', 
              'messageError', 'typing', 'messageDelivered', 'messageRead', 'onlineUsers'].includes(eventName)) {
          log(`📡 Evento: ${eventName} - ${JSON.stringify(args)}`, 'event');
        }
      });
    }

    function disconnect() {
      if (socket) {
        socket.disconnect();
        socket = null;
        log('🔌 Desconectado manualmente', 'info');
        updateStatus(false);
      }
    }

    function register() {
      const userId = document.getElementById('userId').value;
      if (!userId) {
        log('❌ Por favor ingresa un ID de usuario', 'error');
        return;
      }
      socket.emit('register', { userId });
      log(`📤 Enviado: register { userId: "${userId}" }`, 'info');
    }

    function joinRoom() {
      const roomId = document.getElementById('roomId').value;
      const userId = document.getElementById('userId').value || currentUserId;
      if (!roomId || !userId) {
        log('❌ Por favor ingresa ID de sala y usuario', 'error');
        return;
      }
      socket.emit('joinRoom', { roomId, userId });
      log(`📤 Enviado: joinRoom { roomId: "${roomId}", userId: "${userId}" }`, 'info');
    }

    function leaveRoom() {
      const roomId = document.getElementById('roomId').value || currentRoomId;
      const userId = document.getElementById('userId').value || currentUserId;
      if (!roomId || !userId) {
        log('❌ Por favor ingresa ID de sala y usuario', 'error');
        return;
      }
      socket.emit('leaveRoom', { roomId, userId });
      log(`📤 Enviado: leaveRoom { roomId: "${roomId}", userId: "${userId}" }`, 'info');
    }

    function sendMessage() {
      const content = document.getElementById('messageContent').value;
      const roomId = document.getElementById('roomId').value || currentRoomId;
      const userId = document.getElementById('userId').value || currentUserId;
      const receiverId = document.getElementById('receiverId').value;

      if (!content || !roomId || !userId) {
        log('❌ Por favor completa los campos requeridos', 'error');
        return;
      }

      const messageData = {
        senderId: userId,
        content,
        roomId,
        receiverId: receiverId || undefined
      };

      socket.emit('sendMessage', messageData);
      log(`📤 Enviado: sendMessage ${JSON.stringify(messageData)}`, 'info');
      document.getElementById('messageContent').value = '';
    }

    function sendTyping() {
      const roomId = document.getElementById('roomId').value || currentRoomId;
      const userId = document.getElementById('userId').value || currentUserId;
      const receiverId = document.getElementById('receiverId').value;

      if (!roomId || !userId) {
        log('❌ Por favor completa los campos requeridos', 'error');
        return;
      }

      const typingData = {
        userId,
        roomId,
        receiverId: receiverId || undefined,
        isTyping: true
      };

      socket.emit('typing', typingData);
      log(`📤 Enviado: typing ${JSON.stringify(typingData)}`, 'info');
    }

    function getOnlineUsers() {
      const roomId = document.getElementById('roomId').value || currentRoomId;
      if (!roomId) {
        log('❌ Por favor ingresa un ID de sala', 'error');
        return;
      }
      socket.emit('getOnlineUsers', { roomId });
      log(`📤 Enviado: getOnlineUsers { roomId: "${roomId}" }`, 'info');
    }

    function clearLog() {
      document.getElementById('log').innerHTML = '';
      log('🧹 Log limpiado', 'info');
    }

    // Initialize
    log('🚀 Cliente WebSocket inicializado', 'success');
    log('💡 Tip: Abre múltiples pestañas para simular varios usuarios', 'info');
  </script>
</body>
</html>
