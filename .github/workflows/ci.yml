name: CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [backend/auth-service, backend/chat-service, backend/web-sockets-service, frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Check if project changed
        id: changes
        shell: bash
        run: |
          echo "PROJECT_CHANGED=false" >> $GITHUB_ENV

          # Detect commits
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "Event: pull_request"
            git fetch origin ${{ github.base_ref }} --depth=1
            BASE=$(git merge-base HEAD origin/${{ github.base_ref }})
          else
            echo "Event: push"
            BASE=$(git rev-parse HEAD^)
          fi

          echo "Comparing changes from $BASE to HEAD"

          # If changes were made, we change to true
          if git diff --name-only $BASE HEAD | grep -q "^${{ matrix.project }}/"; then
            echo "Changes detected in ${{ matrix.project }}"
            echo "PROJECT_CHANGED=true" >> $GITHUB_ENV
          else
            echo "No changes in ${{ matrix.project }}"
          fi

      - name: Install dependencies
        if: env.PROJECT_CHANGED == 'true'
        run: npm install

      - name: Run lint, format, and tests
        if: env.PROJECT_CHANGED == 'true'
        run: |
          echo "🚀 Running Scripts for ${{ matrix.project }}"
          npm --prefix ${{ matrix.project }} run lint
          npm --prefix ${{ matrix.project }} run format
          npm --prefix ${{ matrix.project }} run test --passWithNoTests

      - name: Log in to Docker Hub
        if: env.PROJECT_CHANGED == 'true' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract service name
        if: env.PROJECT_CHANGED == 'true' && github.event_name == 'push'
        id: service_name
        run: |
          NAME=$(basename "${{ matrix.project }}")
          echo "SERVICE_NAME=$NAME" >> $GITHUB_ENV
          echo "Service: $NAME"

      - name: Build Docker image
        if: env.PROJECT_CHANGED == 'true' && github.event_name == 'push'
        run: |
          IMAGE_NAME="${{ secrets.DOCKERHUB_USERNAME }}/${SERVICE_NAME}"

          echo "Building: $IMAGE_NAME:${{ github.sha }}"
          docker build \
            -t $IMAGE_NAME:${{ github.sha }} \
            ${{ matrix.project }}

          # Tag latest only if pushing to main branch
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            docker tag $IMAGE_NAME:${{ github.sha }} $IMAGE_NAME:latest
          fi

      - name: Push Docker image
        if: env.PROJECT_CHANGED == 'true' && github.event_name == 'push'
        run: |
          IMAGE_NAME="${{ secrets.DOCKERHUB_USERNAME }}/${SERVICE_NAME}"

          docker push $IMAGE_NAME:${{ github.sha }}

          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            docker push $IMAGE_NAME:latest
          fi

      
      
